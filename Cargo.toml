[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/application",
  "crates/domain",
  "crates/rdp-protocol",
  "crates/security",
  "crates/session",
  "crates/ssh",
  "crates/storage",
  "helpers/rdp",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-only"
repository = "https://github.com/firstshell/firstshell"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
chacha20poly1305 = "0.10"
getrandom = "0.3"
hkdf = "0.12"
keyring = { version = "4.1", default-features = false, features = ["v1"] }
rand = "0.10"
rusqlite = { version = "0.40", features = ["backup", "bundled"] }
russh = { version = "0.63", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "2.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "2.11", default-features = false, features = ["wry"] }
tauri-build = "2.5"
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.47", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.18", features = ["serde", "v4"] }
zeroize = { version = "1.8", features = ["derive"] }

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
missing_docs = "warn"
nonstandard_style = { level = "deny", priority = -1 }
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = 10 }
pedantic = { level = "warn", priority = 5 }
unwrap_used = "deny"
